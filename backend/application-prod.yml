spring:
  application:
    name: smart-cbwtf-backend
  datasource:
    url: ${DB_URL:${DATABASE_URL}}
    username: ${DB_USERNAME:${DATABASE_USERNAME}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    ignore-missing-migrations: false
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  forward-headers-strategy: framework

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: smart-cbwtf
    access-token-ttl-minutes: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://portal.smartcbwtf.com,https://smartcbwtf.com,https://www.smartcbwtf.com}

logging:
  level:
    root: INFO
    com.smartcbwtf: INFO

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:${EXPOSE_API_DOCS:false}}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:${EXPOSE_API_DOCS:false}}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  bootstrap:
    super-admin:
      username: ${INITIAL_SUPER_ADMIN_USERNAME:}
      password: ${INITIAL_SUPER_ADMIN_PASSWORD:}
      email: ${INITIAL_SUPER_ADMIN_EMAIL:}
      full-name: ${INITIAL_SUPER_ADMIN_FULL_NAME:Platform Administrator}
  security:
    expose-api-docs: ${EXPOSE_API_DOCS:false}
  geofence:
    hcf-radius-m: 200
    facility-default-radius-m: 200
    enable-server-check: true
  gps:
    min-accuracy-m: 50
    max-accuracy-m: 100
  weight:
    mismatch-threshold-kg: 0.5
  alerts:
    missing-bag-hours: 24
  attendance:
    geofence-radius-m: 50
    cooldown-minutes: 5
  email:
    enabled: ${APP_EMAIL_ENABLED:true}
    from: info@smartcbwtf.com
    brevo:
      api-key: ${BREVO_API_KEY:}
      sender-name: SmartCBWTF
  agreement:
    number:
      prefix: HCF
      separator: "-"
      sequence-digits: 5
      include-facility-code: true
      include-year: true
  pdf:
    output-dir: files/agreements
    timezone: Asia/Kolkata
