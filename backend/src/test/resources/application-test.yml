# Test configuration - uses H2 in-memory database with PostgreSQL mode
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false # Use Hibernate DDL for tests

# JWT settings for tests
app:
  jwt:
    secret: test-secret-key-for-testing-purposes-only-must-be-256-bits-long
    expiration-ms: 86400000
  geofence:
    hcf-radius-m: 200
    facility-default-radius-m: 200
  weight:
    mismatch-threshold-kg: 0.5
  gps:
    max-accuracy-m: 100

logging:
  level:
    com.smartcbwtf: DEBUG
    org.springframework.security: WARN
