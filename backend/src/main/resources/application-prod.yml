spring:
  datasource:
    url: ${DB_URL:${DATABASE_URL}}
    username: ${DB_USERNAME:${DATABASE_USERNAME}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    ignore-missing-migrations: false
    validate-on-migrate: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:${EXPOSE_API_DOCS:false}}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:${EXPOSE_API_DOCS:false}}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  forward-headers-strategy: framework

security:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://portal.smartcbwtf.com,https://smartcbwtf.com,https://www.smartcbwtf.com}

logging:
  level:
    com.smartcbwtf: INFO

app:
  email:
    enabled: ${APP_EMAIL_ENABLED:true}
  bootstrap:
    super-admin:
      username: ${INITIAL_SUPER_ADMIN_USERNAME:}
      password: ${INITIAL_SUPER_ADMIN_PASSWORD:}
      email: ${INITIAL_SUPER_ADMIN_EMAIL:}
      full-name: ${INITIAL_SUPER_ADMIN_FULL_NAME:Platform Administrator}
  security:
    expose-api-docs: ${EXPOSE_API_DOCS:false}
